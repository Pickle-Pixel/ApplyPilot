name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/PhaseAWindowsFile.psm1"
      - "scripts/PhaseAEvidenceStore.psm1"
      - "scripts/provision-phase-a-evidence-store.ps1"
      - "scripts/New-PhaseASignedReceipt.ps1"
      - "config/phase-a/**"
      - "tests/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/PhaseAWindowsFile.psm1"
      - "scripts/PhaseAEvidenceStore.psm1"
      - "scripts/provision-phase-a-evidence-store.ps1"
      - "scripts/New-PhaseASignedReceipt.ps1"
      - "config/phase-a/**"
      - "tests/**"
      - "pyproject.toml"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phase-a-windows-file:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phase-a-evidence
            tests: >-
              tests/test_phase_a_windows_file.py
              tests/test_phase_a_evidence_store.py
          - name: legacy-containment
            tests: tests/test_emergency_legacy_authority_containment.py
          - name: fleet-script-contracts
            tests: >-
              tests/test_fleet_machine_blackout_scripts.py
              tests/test_fleet_agent_autoupdate_script.py
          - name: browser-and-otp-contracts
            tests: >-
              tests/test_chrome_reservation.py
              tests/test_linkedin_login.py
              tests/test_otp_runbooks_and_bootstrap.py
              tests/test_mapped_role_deployment_contract.py::test_abrupt_committed_receipt_finalization_leaves_prior_in_doubt_receipt_intact
          - name: pg18-ci-repair-contracts
            tests: >-
              tests/test_load_canary_home_spend_cap.py::test_native_exit_guard_stops_later_steps_after_a_failed_command
              tests/test_mapped_role_deployment_contract.py::test_hba_post_write_failure_restores_hba_and_outputs_byte_exact

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Test Windows-native runtime contracts
        run: python -m pytest -q ${{ matrix.tests }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          # The database-backed security tests intentionally exercise database
          # ACLs and CREATE DATABASE behavior against the default postgres DB.
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: applypilot-ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install --no-deps python-jobspy

      - name: Lint
        run: ruff check src/

      - name: Enable TLS on disposable PostgreSQL service
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          diagnose_postgres_service() {
            docker logs "$POSTGRES_SERVICE_ID" >&2 || true
            docker inspect --format '{{json .State}}' "$POSTGRES_SERVICE_ID" >&2 || true
          }
          docker exec -u 0 "$POSTGRES_SERVICE_ID" bash -ceu '
            openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
              -subj /CN=localhost \
              -keyout "$PGDATA/server.key" \
              -out "$PGDATA/server.crt"
            chown postgres:postgres "$PGDATA/server.crt" "$PGDATA/server.key"
            chmod 600 "$PGDATA/server.key"
            printf "\nssl=on\nssl_cert_file='\''server.crt'\''\nssl_key_file='\''server.key'\''\n" \
              >> "$PGDATA/postgresql.conf"
          '
          if ! docker restart "$POSTGRES_SERVICE_ID"; then
            echo "PostgreSQL service restart failed after enabling TLS" >&2
            diagnose_postgres_service
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if docker exec "$POSTGRES_SERVICE_ID" \
              pg_isready -U postgres -d postgres; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL service did not become ready after enabling TLS" >&2
          diagnose_postgres_service
          exit 1

      - name: Mark disposable PostgreSQL service
        env:
          APPLYPILOT_PGTEST_DSN: postgresql://postgres:applypilot-ci-test-only@127.0.0.1:5432/postgres?sslmode=require
          APPLYPILOT_PGTEST_CLUSTER_MARKER: ci-${{ github.run_id }}-${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os
          import psycopg
          from psycopg import sql

          dsn = os.environ["APPLYPILOT_PGTEST_DSN"]
          nonce = os.environ["APPLYPILOT_PGTEST_CLUSTER_MARKER"]
          with psycopg.connect(dsn) as connection:
              ssl_setting = connection.execute("SHOW ssl").fetchone()[0]
              if ssl_setting != "on":
                  raise RuntimeError("PostgreSQL service did not enable TLS")
              connection.execute(
                  "COMMENT ON DATABASE postgres IS 'applypilot:disposable-postgres-test-database:v1'"
              )
              connection.execute(
                  "CREATE ROLE applypilot_disposable_cluster_marker "
                  "NOLOGIN NOINHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
              )
              connection.execute(
                  sql.SQL("COMMENT ON ROLE applypilot_disposable_cluster_marker IS {}").format(
                      sql.Literal("applypilot:disposable-postgres-test-cluster:v1:" + nonce)
                  )
              )
          PY

      - name: Test
        env:
          APPLYPILOT_PGTEST_DSN: postgresql://postgres:applypilot-ci-test-only@127.0.0.1:5432/postgres?sslmode=require
          APPLYPILOT_PGTEST_DISPOSABLE: "1"
          APPLYPILOT_PGTEST_CLUSTER_MARKER: ci-${{ github.run_id }}-${{ matrix.python-version }}
        run: >-
          pytest tests/ -v
          --ignore=tests/test_emergency_legacy_authority_containment.py
          --ignore=tests/test_fleet_machine_blackout_scripts.py
          --ignore=tests/test_fleet_agent_autoupdate_script.py
          --ignore=tests/test_chrome_reservation.py
          --ignore=tests/test_linkedin_login.py
          --ignore=tests/test_otp_runbooks_and_bootstrap.py
          --deselect=tests/test_load_canary_home_spend_cap.py::test_native_exit_guard_stops_later_steps_after_a_failed_command
          --deselect=tests/test_mapped_role_deployment_contract.py::test_hba_post_write_failure_restores_hba_and_outputs_byte_exact

      - name: Install package build tools
        if: matrix.python-version == '3.12'
        run: pip install build

      - name: Build wheel and source distribution
        if: matrix.python-version == '3.12'
        run: python -m build

  container-build:
    # Non-publishing build gate: proves the cloud apply-fleet worker image
    # (Dockerfile) still builds and exposes its expected runtime surface.
    # This job must never gain a registry login or push step, and must never
    # reference repository environments or secrets — it only builds locally
    # on the runner and inspects the result. See tests/test_container_build_contract.py
    # for a static regression guard on that boundary.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image (no push, no registry login)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: applypilot-worker:ci-candidate

      - name: Deterministic image smoke check
        run: |
          set -euo pipefail
          IMG=applypilot-worker:ci-candidate

          # No network, no secrets, no live services, no timestamps: this only
          # checks that the image was built with the expected runtime surface
          # (package importable on the expected Python, entrypoint script
          # present and executable, LiteLLM config shipped, Chrome shim
          # linked). It intentionally does NOT invoke CMD (deploy/entrypoint.sh)
          # -- that script requires FLEET_PG_DSN, DEEPSEEK_API_KEY, and mounted
          # PII (profile.json, resume.pdf) before it will start anything.
          docker run --rm --entrypoint python3 "$IMG" -c "import sys, applypilot, psycopg, litellm; assert sys.version_info[:2] == (3, 12), sys.version_info; print('python', sys.version.split()[0], 'applypilot', applypilot.__version__)"
          docker run --rm --entrypoint test "$IMG" -x /app/entrypoint.sh
          docker run --rm --entrypoint test "$IMG" -f /app/litellm_config.yaml
          docker run --rm --entrypoint sh "$IMG" -c "test -x /usr/bin/google-chrome"
          echo "container smoke check ok"
