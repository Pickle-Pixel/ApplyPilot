<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ApplyPilot — CTO Product Intelligence Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="brand">
    ApplyPilot
    <span class="sub">CTO Dashboard · Product Intelligence</span>
  </div>
  <nav class="tabs">
    <button data-tab="overview">Overview</button>
    <button data-tab="roles">Roles</button>
    <button data-tab="journeys">Journeys</button>
    <button data-tab="features">Features</button>
    <button data-tab="capabilities">Capabilities</button>
    <button data-tab="code">Code</button>
    <button data-tab="risks">Risks</button>
  </nav>
</header>

<div class="tier-filter">
  <label>Filter by Tier:</label>
  <button data-tier="0" class="active tier-all">All</button>
  <button data-tier="1" class="tier-1">Tier 1 · Discovery</button>
  <button data-tier="2" class="tier-2">Tier 2 · AI Scoring</button>
  <button data-tier="3" class="tier-3">Tier 3 · Auto-Apply</button>
</div>

<main>
  <div id="view-overview" class="tab-content active"></div>
  <div id="view-roles" class="tab-content"></div>
  <div id="view-journeys" class="tab-content"></div>
  <div id="view-features" class="tab-content"></div>
  <div id="view-capabilities" class="tab-content"></div>
  <div id="view-code" class="tab-content"></div>
  <div id="view-risks" class="tab-content"></div>
</main>

<script src="data-loader.js"></script>
<script src="app.js"></script>
</body>
</html>
