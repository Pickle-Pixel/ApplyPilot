# Workday employer registry for ApplyPilot — Warehousing & Logistics, Greater Vancouver
# Users can add their own employers by following this pattern.
# Find your employer's Workday URL at: https://[company].wd[N].myworkdayjobs.com
#
# This registry focuses on employers operating warehouses, distribution
# centres, or fulfillment sites in Metro Vancouver. Many also run national
# sites on the same Workday tenant — the discovery pipeline filters by the
# location patterns in searches.yaml.

employers:

  # ── Grocery & Food Retail Distribution ──────────────────────────────────

  # Loblaw Companies — operates the Marine Drive Distribution Centre in
  # Vancouver and is one of the largest DC employers in BC. The DC postings
  # live on a separate Workday tenant (`myview`) from corporate retail.
  loblaw_dc:
    name: "Loblaw Distribution Centres"
    tenant: "myview"
    site_id: "loblaw_DC_jobs"
    base_url: "https://myview.wd3.myworkdayjobs.com"

  loblaw_retail:
    name: "Loblaw Retail"
    tenant: "myview"
    site_id: "loblaw_retail"
    base_url: "https://myview.wd3.myworkdayjobs.com"

  # Pattison Food Group — parent of Save-On-Foods, Western Canada's largest
  # grocery retailer. HQ and distribution operations are in Langley, BC.
  save_on_foods:
    name: "Save-On-Foods (Pattison Food Group)"
    tenant: "pfg"
    site_id: "SaveonfoodsCareers"
    base_url: "https://pfg.wd3.myworkdayjobs.com"

  # Walmart Canada — operates a major distribution centre in Surrey, BC
  # (8889 165 St / 192 St) plus the smaller Mississauga & Calgary networks.
  walmart_canada:
    name: "Walmart Canada"
    tenant: "walmart"
    site_id: "WalmartExternal"
    base_url: "https://walmart.wd5.myworkdayjobs.com"

  # Sysco — foodservice distribution. Sysco BC operates a Port Coquitlam
  # facility and ships across the province.
  sysco:
    name: "Sysco"
    tenant: "sysco"
    site_id: "syscocareers"
    base_url: "https://sysco.wd5.myworkdayjobs.com"

  # ── Big Box & General Merchandise ───────────────────────────────────────

  # Home Depot Canada — DC + store warehouse roles. Canadian career portal
  # is a separate site_id from the US.
  home_depot_canada:
    name: "Home Depot Canada"
    tenant: "homedepot"
    site_id: "CareerDepotCanada"
    base_url: "https://homedepot.wd5.myworkdayjobs.com"

  # Canadian Tire — runs distribution centres feeding stores across Canada.
  canadian_tire:
    name: "Canadian Tire"
    tenant: "canadiantirecorporation"
    site_id: "Enterprise_External_Careers_Site"
    base_url: "https://canadiantirecorporation.wd3.myworkdayjobs.com"

  # ── Parcel, Courier & Last-Mile ─────────────────────────────────────────

  # FedEx Canada — package handler and warehouse roles at sort centres in
  # Richmond and elsewhere.
  fedex_canada:
    name: "FedEx Canada"
    tenant: "fedex"
    site_id: "FXE-Canada_External_Career_Site"
    base_url: "https://fedex.wd1.myworkdayjobs.com"

  # FedEx Ground / Express US site — some Canadian roles cross-post here.
  fedex:
    name: "FedEx"
    tenant: "fedex"
    site_id: "FXE"
    base_url: "https://fedex.wd1.myworkdayjobs.com"

  # ── Healthcare & Pharma Logistics ───────────────────────────────────────

  # McKesson Canada — pharma distribution centres; runs a BC operation.
  mckesson:
    name: "McKesson"
    tenant: "mckesson"
    site_id: "External_Careers"
    base_url: "https://mckesson.wd3.myworkdayjobs.com"

  # ── 3PL & Supply Chain ──────────────────────────────────────────────────

  # DHL Supply Chain has warehouses in Burnaby and Richmond serving
  # major Canadian retail clients.
  dhl:
    name: "DHL"
    tenant: "dhl"
    site_id: "DHL"
    base_url: "https://dhl.wd3.myworkdayjobs.com"

  # Day & Ross — Canadian LTL carrier with terminals in Surrey.
  day_ross:
    name: "Day & Ross"
    tenant: "dayross"
    site_id: "External"
    base_url: "https://dayross.wd3.myworkdayjobs.com"

  # ── Manufacturing & Industrial ──────────────────────────────────────────

  # Magna — auto-parts manufacturer with warehousing/material-handler roles.
  magna:
    name: "Magna International"
    tenant: "magna"
    site_id: "Magna"
    base_url: "https://magna.wd3.myworkdayjobs.com"

  # ── Direct Career Sites (non-Workday) ───────────────────────────────────
  # Several major warehouse employers in Metro Vancouver do NOT use Workday
  # and are therefore handled through the JobSpy/direct-site scrapers
  # configured in sites.yaml. These include:
  #
  #   - Amazon (amazon.jobs)              — YVR4 Delta, YVR7 Burnaby, plus delivery
  #   - Costco (costco.com/jobs.html)     — Burnaby & Langley warehouses
  #   - IKEA (ikea.com/ca/en/jobs)        — Coquitlam & Richmond stores + DC
  #   - UPS (jobs-ups.com)                — Richmond hub
  #   - Purolator (careers.purolator.com) — Richmond sort facility
  #   - Gordon Food Service (gfs.ca)      — Delta distribution centre
  #   - 18 Wheels Logistics               — Burnaby / Richmond / Aldergrove
  #   - Stryder Canada                    — Richmond beverage centre
  #   - 7 Mountain Logistics              — Metro Vancouver cold storage
  #   - Radius Logistics                  — Surrey 3PL
  #   - XPO Logistics                     — Surrey terminal
  #
  # If you find Workday tenants for any of these, contribute them back via
  # the GitHub repo.
