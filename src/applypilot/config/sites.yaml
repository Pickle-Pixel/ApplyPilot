# Direct career site registry for ApplyPilot — Warehousing & Logistics, Greater Vancouver
#
# Users can add their own sites following this pattern.
# Use {location_encoded} placeholder for location (URL-encoded).
# Use {query_encoded} placeholder for search terms (URL-encoded).
#
# This config is tuned for warehouse / order picker / material handler
# roles in Metro Vancouver. Remote-tech boards (RemoteOK, WeWorkRemotely,
# etc.) have been removed because they don't list on-site warehouse work.

# ── Manual-Only ATS Domains ──────────────────────────────────────────────
# These ATS platforms have unsolvable CAPTCHAs. Jobs routing through them
# are flagged as "manual" during apply — bot skips, user applies by hand.
manual_ats:
  - "ibegin.tcsapps.com"       # TCS iBegin — unsolvable CAPTCHA every time

# ── Blocked sites — too problematic for automation ───────────────────────
blocked:
  sites:
    - "glassdoor"
    - "google"
    - "Workopolis"
  url_patterns:
    - "%glassdoor%"
    - "%google.com/about/careers%"
    - "%google.jobs%"
    - "%workopolis.com/out%"

# ── Blocked SSO domains — cannot authenticate through these ──────────────
blocked_sso:
  - "accounts.google.com"
  - "login.microsoftonline.com"
  - "okta.com"
  - "auth0.com"

# ── Base URLs for URL resolution ─────────────────────────────────────────
# Used by detail enrichment to resolve relative URLs scraped from sites.
# Sites not listed here (or with null) cannot have relative URLs resolved.
base_urls:
  "Job Bank Canada": "https://www.jobbank.gc.ca"
  "WorkBC": "https://www.workbc.ca"
  "CareerJet Canada": "https://www.careerjet.ca"
  "Talent.com": "https://www.talent.com"
  "Eluta": "https://www.eluta.ca"
  "Jooble Canada": "https://ca.jooble.org"
  "Randstad Canada": "https://www.randstad.ca/jobs/search/"
  "Adecco Canada": "https://www.adecco.ca"
  "Aerotek Canada": "https://www.aerotek.com"
  "Drake International": "https://www.drakeintl.com"
  "Workopolis": "https://www.workopolis.com"
  "Amazon Jobs": "https://www.amazon.jobs"
  "Costco Canada": "https://www.costco.ca"
  "IKEA Canada": "https://www.ikea.com"
  "UPS Careers": "https://www.jobs-ups.com"
  "Purolator": "https://careers.purolator.com"
  "Gordon Food Service": "https://gfs.ca"
  "Save-On-Foods": "https://www.saveonfoods.com"
  "Loblaw Careers": "https://careers.loblaw.ca"
  "Walmart Canada Careers": "https://careers.walmart.ca"
  "Sysco Careers": "https://careers.sysco.com"

sites:
  # ── Canadian general job boards ───────────────────────────────────────
  - name: "Job Bank Canada"
    url: "https://www.jobbank.gc.ca/jobsearch/jobsearch?searchstring={query_encoded}&locationstring={location_encoded}&fage=7&sort=D"
    type: search

  - name: "WorkBC"
    url: "https://www.workbc.ca/job-seekers/search-jobs?search={query_encoded}&location={location_encoded}"
    type: search

  - name: "Eluta"
    url: "https://www.eluta.ca/search?q={query_encoded}&l={location_encoded}"
    type: search

  - name: "Talent.com"
    url: "https://www.talent.com/jobs?k={query_encoded}&l={location_encoded}"
    type: search

  - name: "CareerJet Canada"
    url: "https://www.careerjet.ca/search/jobs?s={query_encoded}&l={location_encoded}"
    type: search

  - name: "Jooble Canada"
    url: "https://ca.jooble.org/SearchResult?ukw={query_encoded}&rgns={location_encoded}"
    type: search

  # ── Staffing agencies — heavy warehouse focus in Metro Vancouver ──────
  - name: "Randstad Canada"
    url: "https://www.randstad.ca/jobs/?keywords={query_encoded}&location={location_encoded}"
    type: search

  - name: "Adecco Canada"
    url: "https://www.adecco.ca/en-ca/jobs/?keywords={query_encoded}&location={location_encoded}"
    type: search

  - name: "Aerotek Canada"
    url: "https://www.aerotek.com/en-ca/find-a-job?searchTerm={query_encoded}&location={location_encoded}"
    type: search

  - name: "Drake International"
    url: "https://drakeintl.com/canada/job-seekers/job-search?keyword={query_encoded}&location={location_encoded}"
    type: search

  - name: "Express Employment Canada"
    url: "https://www.expresspros.com/canada/jobs/?keyword={query_encoded}&location={location_encoded}"
    type: search

  - name: "Labour Unlimited"
    url: "https://www.labourunlimited.com/jobs?search={query_encoded}"
    type: search

  # ── Major warehouse employers (direct career sites) ───────────────────
  - name: "Amazon Jobs"
    url: "https://www.amazon.jobs/en/search?base_query={query_encoded}&loc_query={location_encoded}&country=CAN"
    type: search

  - name: "Costco Canada"
    url: "https://www.costco.ca/job-search.html?keyword={query_encoded}&location={location_encoded}"
    type: search

  - name: "IKEA Canada"
    url: "https://www.ikea.com/ca/en/jobs/search/?keyword={query_encoded}&location={location_encoded}"
    type: search

  - name: "UPS Careers"
    url: "https://www.jobs-ups.com/search-jobs/{query_encoded}/Canada/{location_encoded}"
    type: search

  - name: "Purolator"
    url: "https://careers.purolator.com/search/?q={query_encoded}&locationsearch={location_encoded}"
    type: search

  - name: "Gordon Food Service"
    url: "https://gfs.ca/en-ca/careers"
    type: static

  - name: "Save-On-Foods"
    url: "https://www.saveonfoods.com/join-our-team"
    type: static

  - name: "Loblaw Careers"
    url: "https://careers.loblaw.ca/search-jobs/{query_encoded}/Canada/{location_encoded}"
    type: search

  - name: "Walmart Canada Careers"
    url: "https://careers.walmart.ca/search-jobs/{query_encoded}/British-Columbia/{location_encoded}"
    type: search

  - name: "Sysco Careers"
    url: "https://careers.sysco.com/jobs?keywords={query_encoded}&location={location_encoded}"
    type: search

  # ── Local 3PL & logistics ─────────────────────────────────────────────
  - name: "18 Wheels Logistics"
    url: "https://www.18wheelslogistics.com/careers"
    type: static

  - name: "Stryder Canada"
    url: "https://www.strydercanada.com/careers/"
    type: static

  - name: "Radius Logistics"
    url: "https://www.radiuslogistics.com/careers/"
    type: static

  - name: "Day & Ross"
    url: "https://dayrossgroup.com/careers/"
    type: static
